# 베리즈 10분 집계 수집(scripts/berriz_collect.py). 베리즈가 Cloudflare 요청을 거절해서 조회는 GitHub에서 한다.
# 한 번 실행이 최대 5시간 40분 동안 10분마다(00·10·20…분 집계) 읽어 Worker로 보낸다.
# 예약(15분마다)은 다음 실행을 미리 대기시키는 용도다. 같은 그룹은 하나만 실행되고, 대기 중인 실행은 새 예약으로 바뀐다.
# 그래서 GitHub 예약이 늦어도 수집이 끊기지 않고, 지금 실행이 끝나면 대기 중인 실행이 바로 이어받는다.
# 공개 저장소라 무료. 필요한 비밀값: INGEST_TOKEN(Cloudflare Worker 비밀값과 같은 값).
name: Berriz collect

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # 베리즈가 여기서도 거절하면 이 워크플로 예약을 끄기 위해

concurrency:
  group: berriz-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - name: Collect Berriz every 10 minutes
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/berriz_collect.py
