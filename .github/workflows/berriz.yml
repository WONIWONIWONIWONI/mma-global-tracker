# GitHub 수집(scripts/github_collect.py)
# - 베리즈: 10분 집계마다 읽어 Worker로 보낸다(베리즈가 Cloudflare 요청을 거절해서 여기서 읽음).
# - 멜론 보조: 1분마다 읽어 5분마다 보내고, Worker는 빠진 분만 채운다(Cloudflare 한도 초과 때 기록 지키기).
# - 보내기 실패분은 보관했다가 다시 보낸다. 실행이 끝날 때 남아 있으면 backup/pending.json 으로 저장소에 남긴다.
# 한 번 실행이 최대 5시간 40분. 예약(15분마다)은 다음 실행을 미리 대기시키는 용도다. 같은 그룹은 하나만 실행되고,
# 대기 중인 실행은 새 예약으로 바뀐다. 그래서 GitHub 예약이 늦어도 수집이 끊기지 않는다.
# 공개 저장소라 무료. 필요한 비밀값: INGEST_TOKEN(Cloudflare Worker 비밀값과 같은 값).
name: GitHub collect (Berriz + Melon backup)

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # 못 보낸 값(backup/pending.json)과 차단 표시 파일을 저장소에 남기기 위해

concurrency:
  group: berriz-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - name: Collect Berriz (10 min) and Melon backup (1 min)
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: python3 scripts/github_collect.py
